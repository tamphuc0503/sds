version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    networks:
      - kong-net

  kong-migrations:
    image: kong/kong:3.6
    command: kong migrations bootstrap
    depends_on:
      - postgres
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    networks:
      - kong-net

  kong:
    image: kong/kong:3.6
    container_name: kong
    depends_on:
      - kong-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - kong-net

  kong-dbless:
    image: kong/kong:3.6
    container_name: kong
    environment:
      KONG_DATABASE: off
      KONG_ADMIN_LISTEN: 0.0.0.0:8002
      KONG_DECLARATIVE_CONFIG: /kong/kong.yaml
    volumes:
      - ./kong.yaml:/kong/kong.yaml
    ports:
      - "8002:8002"
      - "8003:8003"
    networks:
      - kong-net
networks:
  kong-net:
